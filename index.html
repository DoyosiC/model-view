<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Turntable</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">LOCAL 3D VIEWER</p>
          <h1>3D Turntable</h1>
        </div>
        <button id="theme-button" class="icon-button" type="button" aria-label="背景色を変更">◐</button>
      </header>

      <section class="workspace">
        <aside class="panel">
          <label id="drop-zone" class="drop-zone" for="file-input">
            <span class="drop-icon">＋</span>
            <strong>3Dファイルを選択</strong>
            <span>またはここへドロップ</span>
            <small>OBJ + MTL + textures / PLY / GLB / GLTF / STL / DAE</small>
          </label>
          <input id="file-input" type="file" multiple accept=".obj,.mtl,.ply,.glb,.gltf,.stl,.dae,.png,.jpg,.jpeg,.webp,.bin" />

          <div class="field">
            <label for="url-input">ワークスペース内のモデルURL</label>
            <div class="url-row">
              <input id="url-input" type="text" placeholder="https://example.com/model.glb" />
              <button id="url-button" type="button">開く</button>
            </div>
          </div>

          <div class="controls">
            <div class="control-heading">
              <span>自動回転</span>
              <button id="play-button" class="pill active" type="button">停止</button>
            </div>
            <label for="speed-input">速度 <output id="speed-output">20°/秒</output></label>
            <input id="speed-input" type="range" min="0" max="90" value="20" />
            <label for="axis-input">回転軸</label>
            <select id="axis-input">
              <option value="y">Y（縦軸）</option>
              <option value="z">Z（3D Recon向け）</option>
              <option value="x">X</option>
            </select>
          </div>

          <dl class="model-info">
            <div><dt>モデル</dt><dd id="model-name">サンプル</dd></div>
            <div><dt>形式</dt><dd id="model-format">Three.js</dd></div>
            <div><dt>サイズ</dt><dd id="model-size">—</dd></div>
          </dl>
        </aside>

        <section id="viewer" class="viewer" aria-label="3Dモデル表示">
          <div id="loading" class="loading hidden"><span></span><p>読み込み中…</p></div>
          <div id="message" class="message">左ドラッグで回転・ホイールで拡大縮小</div>
        </section>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
