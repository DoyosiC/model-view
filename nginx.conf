server {
    listen 80;
    server_name _;
    # Keep redirects relative so Docker's published host port (8080 by
    # default) is not lost when nginx itself listens on port 80.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Large reconstructed OBJ/PLY files are streamed directly by nginx.
    sendfile on;
    aio threads;
    client_max_body_size 0;

    types {
        text/html                         html htm;
        text/css                          css;
        text/javascript                   js mjs;
        application/json                  json gltf;
        application/octet-stream          bin glb obj mtl ply stl dae;
        image/png                         png;
        image/jpeg                        jpg jpeg;
        image/webp                        webp;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
    }
}
